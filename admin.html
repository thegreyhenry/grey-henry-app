<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Grey Henry Society — Panel administracyjny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--green:#2A3431;--deep:#1C2420;--gold:#BFB178;--gold2:#8F7F48;--parch:#E8DFCB;--ivory:#F4EEE1;--ink:#23302B;--muted:#6B7771;--line:#e3dccb;--bg:#FBF8F1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,.serif{font-family:'Playfair Display',serif;font-weight:500}
a{color:inherit;text-decoration:none}
.muted{color:var(--muted)}
/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#2A3431,#1C2420)}
.loginbox{background:var(--ivory);width:340px;max-width:92vw;border-radius:20px;padding:34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
.loginbox img{height:74px;margin-bottom:10px}
.loginbox .eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:11px;color:var(--gold2);font-weight:600}
.loginbox h1{font-size:22px;margin:6px 0 18px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--gold)}
.loginbox input{margin-bottom:11px}
.btn{font-family:inherit;font-weight:500;font-size:14px;border:none;border-radius:11px;padding:11px 16px;cursor:pointer;background:var(--green);color:var(--ivory);transition:opacity .15s,transform .05s}
.btn:hover{opacity:.92}.btn:active{transform:scale(.99)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold2)}
.btn.danger{background:#9b3b32}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.err{color:#9b3b32;font-size:13px;min-height:18px;margin-top:4px}
/* LAYOUT */
#app{display:none;min-height:100vh;grid-template-columns:248px 1fr;grid-template-rows:100vh}
.sidebar{background:linear-gradient(180deg,#2A3431,#1C2420);color:var(--ivory);padding:24px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand img{height:42px}
.brand b{font-family:'Playfair Display',serif;font-size:16px;font-weight:500;line-height:1.1}
.brand span{display:block;font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;color:#cdd3cd;font-size:14px;cursor:pointer;font-weight:400}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--gold2);color:#fff;font-weight:500}
.nav .ic{width:18px;text-align:center;opacity:.85}
.sb-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:#aeb6ae}
.sb-foot .who{color:#fff;font-weight:500}
.main{overflow:auto;padding:0 0 60px}
.topbar{position:sticky;top:0;z-index:5;background:rgba(251,248,241,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:18px 32px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:22px}
.topbar .sub{font-size:13px;color:var(--muted)}
.content{padding:26px 32px}
/* CARDS / KPI */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--gold),transparent)}
.kpi .lab{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);font-weight:600}
.kpi .val{font-family:'Playfair Display',serif;font-size:30px;margin-top:6px}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 0;margin-top:18px;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:17px}
.panel-h .tools{display:flex;gap:8px;align-items:center}
.panel-h input,.panel-h select{width:auto;padding:8px 11px}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 18px;border-bottom:1px solid #f0ebdd;vertical-align:middle}
th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;background:#fcfaf4}
tr:last-child td{border-bottom:none}
td .row{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.4px}
.b-approved{background:#e3efe6;color:#2f6b46}
.b-pending{background:#fbf1d8;color:#8a6d1e}
.b-rejected{background:#f6e2df;color:#9b3b32}
.b-draft{background:#eceae3;color:#6b6256}
.role{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#eef0ec;color:#3c463f}
.role.admin{background:#2A3431;color:var(--ivory)}
.role.moderator{background:var(--gold2);color:#fff}
.role.dietitian{background:#dfe7df;color:#2f6b46}
.muted-cell{color:var(--muted);font-size:12.5px}
.empty{padding:30px 18px;text-align:center;color:var(--muted)}
.loading{padding:30px;text-align:center;color:var(--muted)}
/* MODAL */
.modal{position:fixed;inset:0;background:rgba(20,28,24,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:24px 26px}
.modal-box h3{font-size:20px;margin-bottom:4px}
.modal-box .sec{margin-top:16px}
.modal-box .sec b{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold2)}
.modal-box ul{margin:8px 0 0 18px;font-size:13.5px;line-height:1.7}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:#f1ede1;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--ivory);padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.grpttl{padding:14px 18px 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold2);font-weight:600}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.sidebar{flex-direction:row;flex-wrap:wrap;height:auto;position:sticky;top:0;z-index:10}.sb-foot{display:none}.brand{width:100%;padding-bottom:8px}}
.modal-box label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.modal-box .grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chipgrp{margin-top:12px}.chipgrp .gl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold2);font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.achip{background:#f4f0e6;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink);transition:background .12s,color .12s}
.achip.active{background:var(--green);color:var(--ivory);border-color:var(--green)}
.kpi{transition:transform .14s ease,box-shadow .14s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 32px -20px rgba(40,50,45,.4)}
.panel{box-shadow:0 12px 30px -24px rgba(40,50,45,.28)}
.panel-h .tools{flex-wrap:wrap}
table tbody tr{transition:background .12s}
table tbody tr:hover{background:#faf7ee}
.kpi .val{font-size:32px}
.btn.sm{border-radius:9px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold2);cursor:pointer;flex:0 0 auto}
.nav a{transition:background .14s,color .14s}
.pushcheck{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px;font-size:13.5px;cursor:pointer;line-height:1.5}
.pushcheck input{width:18px;height:18px;accent-color:var(--gold2);margin-top:1px;flex:0 0 auto}
.pushprev-wrap{margin-top:18px}
.pushprev-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);font-weight:600;margin-bottom:8px}
.pushprev{display:flex;gap:12px;align-items:center;background:linear-gradient(150deg,#2A3431,#1C2420);color:#F4EEE1;border-radius:14px;padding:14px 16px;box-shadow:0 12px 28px -16px rgba(0,0,0,.55)}
.pushprev .pp-ic{width:40px;height:40px;border-radius:10px;background:rgba(191,177,120,.16);display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.pushprev .pp-ic img{width:28px;height:28px}
.pushprev .pp-tx{min-width:0}
.pushprev .pp-tx b{display:block;font-family:'Jost',sans-serif;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pushprev .pp-tx span{display:block;font-size:12.5px;color:#c7cfc8;margin-top:2px;line-height:1.4;max-height:36px;overflow:hidden}
.liverow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.liverow b{color:var(--ink);font-weight:600}
.livedot{width:9px;height:9px;border-radius:50%;background:#3a9d5d;flex:0 0 auto;animation:livepulse 2s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(58,157,93,.45)}70%{box-shadow:0 0 0 8px rgba(58,157,93,0)}100%{box-shadow:0 0 0 0 rgba(58,157,93,0)}}
</style>
</head>
<body>

<div id="login">
  <div class="loginbox">
    <img src="logo/crest_green.png" alt="" onerror="this.style.display='none'">
    <div class="eyebrow">The Grey Henry Society</div>
    <h1>Panel administracyjny</h1>
    <input id="lemail" type="email" placeholder="E-mail" autocomplete="username">
    <input id="lpass" type="password" placeholder="Hasło" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn block" onclick="doLogin()">Zaloguj się</button>
    <div class="err" id="lerr"></div>
    <p class="muted" style="font-size:12px;margin-top:10px">Dostęp tylko dla administratorów i moderatorów.</p>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand"><img src="logo/mono_gold.png" alt="" onerror="this.style.display='none'"><div><b>Grey Henry</b><span>Administracja</span></div></div>
    <nav class="nav" id="nav">
      <a data-v="dash" class="active"><span class="ic">▦</span> Pulpit</a>
      <a data-v="mod"><span class="ic">⚑</span> Moderacja <span id="modcount"></span></a>
      <a data-v="recipes"><span class="ic">❦</span> Przepisy</a>
      <a data-v="collections"><span class="ic">▣</span> Kolekcje</a>
      <a data-v="import"><span class="ic">⇪</span> Import zbiorczy</a>
      <a data-v="users"><span class="ic">◍</span> Użytkownicy</a>
      <a data-v="comments"><span class="ic">❝</span> Komentarze</a>
      <a data-v="tags"><span class="ic">⌗</span> Tagi</a>
      <a data-v="announce"><span class="ic">✦</span> Ogłoszenia</a>
      <a data-v="push"><span class="ic">🔔</span> Powiadomienia</a>
    </nav>
    <div class="sb-foot">
      <div class="who" id="whoami"></div>
      <div id="whorole" style="margin:3px 0 10px"></div>
      <button class="btn ghost sm" style="color:#cdd3cd;border-color:rgba(255,255,255,.2)" onclick="doLogout()">Wyloguj</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><div><h2 id="vtitle">Pulpit</h2><div class="sub" id="vsub"></div></div><button class="btn ghost sm" onclick="refreshAll()">Odśwież dane</button></div>
    <div class="content" id="view"><div class="loading">Ładowanie…</div></div>
  </main>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const SB_URL="https://aprzeqqjtwtbaoqbdolv.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwcnplcXFqdHd0YmFvcWJkb2x2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NzY1MjYsImV4cCI6MjA5NzQ1MjUyNn0.AxNIw_2qJf32ne8XslXFFMjV4dU9jLlFkOOxmUmD0QM";
// plainFetch: konwersja Headers->obiekt (fix DataCloneError w sandboxie)
function _pf(input,init){init=init||{};if(init.headers&&typeof init.headers.forEach==='function'){const h={};init.headers.forEach((v,k)=>h[k]=v);init.headers=h;}return fetch(input,init);}
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const STAFF=['admin','moderator','dietitian'];
const $=id=>document.getElementById(id);
let me=null, db={users:[],recipes:[],comments:[],tags:[],counts:{}}, uMap={}, rMap={}, view='dash';
let recFilter='all', recQ='', recSort='new', userQ='', modSel=new Set();

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtD(s){if(!s)return '—';try{return new Date(s).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});}catch(e){return '—';}}
const isAdmin=()=>me&&me.role==='admin';

async function doLogin(){
  $('lerr').textContent='';
  const email=$('lemail').value.trim(), pass=$('lpass').value;
  if(!email||!pass){$('lerr').textContent='Podaj e-mail i hasło.';return;}
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){$('lerr').textContent='Błąd logowania: '+error.message;return;}
  await afterLogin(data.user);
}
async function afterLogin(user){
  const {data:prof}=await sb.from('profiles').select('display_name,role').eq('id',user.id).single();
  if(!prof||STAFF.indexOf(prof.role)<0){
    $('lerr').textContent='Brak uprawnień — to konto nie jest administratorem ani moderatorem.';
    await sb.auth.signOut();return;
  }
  me={id:user.id,name:prof.display_name||'Administrator',role:prof.role};
  $('login').style.display='none';$('app').style.display='grid';
  $('whoami').textContent=me.name;
  $('whorole').innerHTML='<span class="role '+me.role+'">'+me.role+'</span>';
  if(!isAdmin()){const ua=document.querySelector('#nav a[data-v="users"]');if(ua)ua.style.display='none';}
  await refreshAll();
  if(!window._statsPoll){window._statsPoll=setInterval(async()=>{if(view==='dash'&&!document.hidden&&me){try{const {data}=await sb.rpc('admin_stats');if(data){db.stats=data;if(view==='dash')renderDash();}}catch(e){}}},20000);}
  if(!window._statsFocus){window._statsFocus=true;window.addEventListener('focus',async()=>{if(view==='dash'&&me){try{const {data}=await sb.rpc('admin_stats');if(data){db.stats=data;renderDash();}}catch(e){}}});}
  if(!window._presencePoll){const ping=()=>{if(me&&sb){try{sb.rpc('touch_seen');}catch(e){}}};ping();window._presencePoll=setInterval(ping,45000);window.addEventListener('focus',ping);document.addEventListener('visibilitychange',()=>{if(!document.hidden)ping();});}
}
async function doLogout(){await sb.auth.signOut();location.reload();}

async function refreshAll(){
  $('view').innerHTML='<div class="loading">Ładowanie danych…</div>';
  try{
    const [u,r,c,t,ratings,dogs,anns,stats,cols,colrec,cfg]=await Promise.all([
      sb.from('profiles').select('id,display_name,role,is_premium,blocked,created_at').order('created_at'),
      sb.from('recipes').select('id,title,status,rating_avg,rating_count,created_at,author_id,featured').order('created_at',{ascending:false}),
      sb.from('comments').select('id,body,created_at,recipe_id,author_id').order('created_at',{ascending:false}).limit(150),
      sb.from('tags').select('key,label,grp').order('grp'),
      sb.from('ratings').select('*',{count:'exact',head:true}),
      sb.from('dogs').select('*',{count:'exact',head:true}),
      sb.from('announcements').select('*').order('created_at',{ascending:false}),
      sb.rpc('admin_stats'),
      sb.from('collections').select('*').order('sort_order'),
      sb.from('collection_recipes').select('*').order('position'),
      sb.from('app_config').select('*')
    ]);
    if(u.error) throw u.error;
    db.users=u.data||[]; db.recipes=r.data||[]; db.comments=c.data||[]; db.tags=t.data||[];
    db.announcements=anns.data||[];
    db.collections=cols.data||[]; db.colRecipes=colrec.data||[]; db.config={}; (cfg.data||[]).forEach(row=>{db.config[row.key]=row.value;});
    db.stats=(stats&&!stats.error&&stats.data)?stats.data:{};
    uMap={}; db.users.forEach(x=>uMap[x.id]=x.display_name||'—');
    rMap={}; db.recipes.forEach(x=>rMap[x.id]=x.title);
    const byStatus={approved:0,pending:0,rejected:0,draft:0};
    db.recipes.forEach(x=>{byStatus[x.status]=(byStatus[x.status]||0)+1;});
    db.counts={users:db.users.length,recipes:db.recipes.length,byStatus,comments:db.comments.length,ratings:ratings.count||0,dogs:dogs.count||0};
    const mc=$('modcount');if(mc)mc.innerHTML=byStatus.pending?'<span class="badge b-pending" style="margin-left:auto">'+byStatus.pending+'</span>':'';
    db.authUsers=[];
    if(isAdmin()){const lr=await adminAction('list_users');if(!lr.error&&lr.data&&lr.data.users)db.authUsers=lr.data.users;}
    render();
  }catch(e){
    $('view').innerHTML='<div class="panel"><div class="empty" style="color:#9b3b32">Nie udało się wczytać danych: '+esc(e.message||String(e))+'<div style="margin-top:12px"><button class="btn gold sm" onclick="refreshAll()">Spróbuj ponownie</button></div></div></div>';
  }
}

function setView(v){view=v;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.v===v));render();}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.dataset.v)setView(a.dataset.v);});

const TITLES={dash:['Pulpit','Przegląd najważniejszych liczb'],mod:['Moderacja','Przepisy oczekujące na akceptację'],recipes:['Przepisy','Wszystkie przepisy w bazie'],collections:['Kolekcje i przepis dnia','Wyróżnione zestawy pokazywane na stronie głównej'],import:['Import zbiorczy','Masowe dodawanie przepisów'],users:['Użytkownicy','Konta, role i dostęp'],comments:['Komentarze','Najnowsze komentarze'],tags:['Tagi','Taksonomia kategorii'],announce:['Ogłoszenia','Komunikaty dla społeczności'],push:['Powiadomienia','Wyślij powiadomienie push do subskrybentów']};
function render(){
  $('vtitle').textContent=TITLES[view][0];$('vsub').textContent=TITLES[view][1];
  if(view==='dash')return renderDash();
  if(view==='mod')return renderMod();
  if(view==='recipes')return renderRecipes();
  if(view==='collections')return renderCollections();
  if(view==='import')return renderImport();
  if(view==='users')return renderUsers();
  if(view==='comments')return renderComments();
  if(view==='tags')return renderTags();
  if(view==='announce')return renderAnnounce();
  if(view==='push')return renderPush();
}

function statusName(k){return {approved:'Opublikowane',pending:'Oczekujące',rejected:'Odrzucone',draft:'Szkice'}[k]||k;}
function bar(data){
  if(!data||!data.length)return '<div class="empty">Brak rejestracji w ostatnich 14 dniach.</div>';
  const max=Math.max(1,...data.map(d=>d.c));
  return '<div style="display:flex;align-items:flex-end;gap:5px;height:104px;padding:10px 2px">'+data.map(d=>{
    const h=Math.round(6+(d.c/max)*78);const dd=d.dt.slice(8,10)+'.'+d.dt.slice(5,7);
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end" title="'+d.c+' nowych"><div style="width:100%;max-width:26px;height:'+h+'px;background:linear-gradient(180deg,#BFB178,#8F7F48);border-radius:4px 4px 0 0"></div><span class="muted-cell" style="font-size:10px">'+dd+'</span></div>';
  }).join('')+'</div>';
}
function renderDash(){
  const c=db.counts,s=c.byStatus||{},st=db.stats||{};
  const kpi=(lab,val,hint)=>`<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="hint">${hint||''}</div></div>`;

async function setRecipeOfDay(id){

async function createCollection(){
  const t=($('newColTitle').value||'').trim(); if(!t){toast('Podaj tytuł');return;}
  const sub=($('newColSub').value||'').trim()||null;
  const maxOrder=Math.max(0,...(db.collections||[]).map(c=>c.sort_order||0));
  const {error}=await sb.from('collections').insert({title:t,subtitle:sub,sort_order:maxOrder+1});
  if(error){toast('Błąd: '+error.message);return;}
  toast('Utworzono kolekcję');await refreshAll();
}
async function editCollection(id){
  const c=(db.collections||[]).find(x=>x.id===id); if(!c)return;
  const t=prompt('Tytuł kolekcji:',c.title); if(t===null)return;

  const {error}=await sb.from('collections').update({title:(t.trim()||c.title),subtitle:(sub.trim()||null)}).eq('id',id);

  toast('Zapisano');await refreshAll();
}
async function deleteCollection(id){

async function toggleCollectionActive(id,val){

async function moveCollection(id,dir){

async function removeFromCollection(cid,rid){

  }).join('')+'</tbody></table>';
}

function ago(ts){
  if(!ts)return '—';
  const d=(Date.now()-new Date(ts).getTime())/1000;
  if(d<60)return 'przed chwilą';
  if(d<3600)return Math.floor(d/60)+' min temu';
  if(d<86400)return Math.floor(d/3600)+' godz. temu';
  if(d<2592000)return Math.floor(d/86400)+' dni temu';
  return fmtD(ts);
}

async function bulkImport(){
  const ta=$('bulkJson');if(!ta)return;
  let arr;
  try{arr=JSON.parse(ta.value);}catch(e){$('bulkResult').innerHTML='<div class="empty" style="color:#9b3b32">Błąd JSON: '+esc(e.message)+'</div>';return;}
  if(!Array.isArray(arr)){$('bulkResult').innerHTML='<div class="empty" style="color:#9b3b32">JSON musi być tablicą [ … ]</div>';return;}
  $('bulkResult').innerHTML='<div class="loading">Importuję '+arr.length+' przepisów…</div>';
  let ok=0;const errs=[];
  for(let idx=0;idx<arr.length;idx++){
    const it=arr[idx]||{};
    try{
      if(!it.title){errs.push('#'+(idx+1)+': brak pola title');continue;}
      const keys=Array.isArray(it.tags)?it.tags:[];
      if(!keys.some(k=>k.indexOf('m_')===0)||!keys.some(k=>k.indexOf('i_')===0)){errs.push('#'+(idx+1)+' ('+it.title+'): wymagany tag m_ i i_');continue;}
      const {data:rec,error}=await sb.from('recipes').insert({author_id:me.id,title:it.title,description:it.description||null,difficulty:it.difficulty||'easy',time_min:it.time_min||null,kcal:it.kcal||null}).select().single();
      if(error){errs.push('#'+(idx+1)+': '+error.message);continue;}
      const rid=rec.id;
      const {data:tg}=await sb.from('tags').select('id,key').in('key',keys);
      if(tg&&tg.length)await sb.from('recipe_tags').insert(tg.map(t=>({recipe_id:rid,tag_id:t.id})));
      const ings=(it.ingredients||[]).map((x,i)=>{if(Array.isArray(x))return {recipe_id:rid,position:i,name:x[0],amount:x[1]||''};const p=String(x).split(/\s[-\u2013]\s/);return {recipe_id:rid,position:i,name:p[0]||String(x),amount:p[1]||''};});
      if(ings.length)await sb.from('recipe_ingredients').insert(ings);
      const steps=(it.steps||[]).map((b,i)=>({recipe_id:rid,position:i,body:String(b)}));
      if(steps.length)await sb.from('recipe_steps').insert(steps);
      if(it.status==='approved'||it.status==='pending'){const {error:se}=await sb.from('recipes').update({status:it.status}).eq('id',rid);if(se){errs.push('#'+(idx+1)+' ('+it.title+'): status — '+se.message);}}
      if(it.featured){await sb.from('recipes').update({featured:false}).eq('featured',true);await sb.from('recipes').update({featured:true}).eq('id',rid);}
      ok++;
    }catch(e){errs.push('#'+(idx+1)+': '+(e.message||e));}
  }
  $('bulkResult').innerHTML='<div style="padding:6px 0;font-size:14px"><b style="color:#2f6b46">Dodano: '+ok+'</b>'+(errs.length?' · <b style="color:#9b3b32">Pominięto: '+errs.length+'</b><ul style="margin:8px 0 0 18px;font-size:12.5px;color:#9b3b32;line-height:1.6">'+errs.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>':' — wszystko OK ✓')+'</div>';
  await refreshAll();
}

      sb.from('recipe_ingredients').select('name,amount,position').eq('recipe_id',id).order('position'),
      sb.from('recipe_steps').select('body,position').eq('recipe_id',id).order('position'),
      sb.from('recipe_tags').select('tags(key)').eq('recipe_id',id)

async function saveRecipeEdit(id,publish){
  const v=i=>{const el=$(i);return el?el.value.trim():'';};
  const title=v('e_title');if(!title){toast('Podaj nazwę przepisu');return;}
  const keys=[...document.querySelectorAll('#e_tags .achip.active')].map(b=>b.dataset.k);
  if(!keys.some(k=>k.indexOf('m_')===0)||!keys.some(k=>k.indexOf('i_')===0)){toast('Wymagany rodzaj posiłku i główny składnik');return;}
  const ing=v('e_ing').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s[-\u2013]\s/);return[p[0]||l,p[1]||''];});
  const steps=v('e_steps').split('\n').map(s=>s.trim()).filter(Boolean);
  const feat=!!($('e_featured')&&$('e_featured').checked);
  const row={title,description:v('e_desc')||null,difficulty:v('e_diff')||'easy',time_min:parseInt(v('e_time'))||null,kcal:parseInt(v('e_kcal'))||null,featured:feat};
  let rid=id;
  try{
    if(!rid){const {data,error}=await sb.from('recipes').insert(Object.assign({author_id:me.id,status:'draft'},row)).select().single();if(error){toast('Błąd: '+error.message);return;}rid=data.id;}
    else{const {error}=await sb.from('recipes').update(row).eq('id',rid);if(error){toast('Błąd: '+error.message);return;}}
    await sb.from('recipe_tags').delete().eq('recipe_id',rid);
    const {data:tg}=await sb.from('tags').select('id,key').in('key',keys);
    if(tg&&tg.length)await sb.from('recipe_tags').insert(tg.map(t=>({recipe_id:rid,tag_id:t.id})));
    await sb.from('recipe_ingredients').delete().eq('recipe_id',rid);
    if(ing.length)await sb.from('recipe_ingredients').insert(ing.map((x,i)=>({recipe_id:rid,position:i,name:x[0],amount:x[1]})));
    await sb.from('recipe_steps').delete().eq('recipe_id',rid);
    if(steps.length)await sb.from('recipe_steps').insert(steps.map((b,i)=>({recipe_id:rid,position:i,body:b})));
    if(feat){await sb.from('recipes').update({featured:false}).neq('id',rid).eq('featured',true);}
    if(publish){const {error:pe}=await sb.from('recipes').update({status:'approved'}).eq('id',rid);if(pe){toast('Zapisano, ale publikacja: '+pe.message);closeModal();await refreshAll();return;}}
  }catch(e){toast('Błąd zapisu: '+(e.message||e));return;}
  toast(publish?'Zapisano i opublikowano':'Zapisano zmiany');closeModal();await refreshAll();
}

async function changeRole(id,role){
  if(id===me.id&&role!=='admin'&&!confirm('Zmieniasz własną rolę z admina. Możesz stracić dostęp do panelu. Kontynuować?'))return renderUsers();
  const {error}=await sb.from('profiles').update({role}).eq('id',id);
  if(error){toast('Błąd: '+error.message);return renderUsers();}
  patchUser(id,{role});toast('Zmieniono rolę');
  if(id===me.id){me.role=role;$('whorole').innerHTML='<span class="role '+role+'">'+role+'</span>';}
}
async function togglePremium(id,val){const v=(val===true||val==='true');const {error}=await sb.from('profiles').update({is_premium:v}).eq('id',id);if(error){toast('Błąd: '+error.message);return;}patchUser(id,{is_premium:v});toast(v?'Włączono premium':'Wyłączono premium');renderUsers();}

async function adminAction(action,payload){
  try{
    const {data,error}=await sb.functions.invoke('admin-actions',{body:Object.assign({action},payload||{})});
    if(error){
      let msg=error.message||'Błąd akcji';
      try{if(error.context&&error.context.json){const ctx=await error.context.json();if(ctx&&ctx.error)msg=ctx.error;}}catch(e){}
      return {error:msg};
    }
    if(data&&data.error)return {error:data.error};
    return {data};
  }catch(e){return {error:e.message||String(e)};}
}
async function createUserForm(){
  const email=$('nu_email').value.trim(),name=$('nu_name').value.trim(),pass=$('nu_pass').value;
  if(!email){toast('Podaj e-mail');return;}
  $('nu_result').innerHTML='<span class="muted-cell">Tworzenie konta…</span>';
  const r=await adminAction('create_user',{email,display_name:name||undefined,password:pass||undefined});
  if(r.error){$('nu_result').innerHTML='<span style="color:#9b3b32">'+esc(r.error)+'</span>';return;}
  const pw=r.data&&r.data.password;
  $('nu_result').innerHTML='<span style="color:#2f6b46">Utworzono konto '+esc(email)+'.</span>'+(pw?(' Hasło tymczasowe: <b>'+esc(pw)+'</b> <span class="muted-cell">— skopiuj i przekaż, nie pojawi się ponownie.</span>'):'');
  $('nu_email').value='';$('nu_name').value='';$('nu_pass').value='';
  await refreshAll();setView('users');
}
async function resetUserPass(id){
  if(!confirm('Wysłać link resetu hasła do tego użytkownika?'))return;
  const r=await adminAction('reset_password',{userId:id,redirectTo:'https://trzesniowskipeter-a11y.github.io/grey-henry-app/'});
  if(r.error){toast('Błąd: '+r.error);return;}
  toast('Wysłano link resetu hasła');
}
async function toggleBlocked(id,val){
  const v=(val===true||val==='true');
  if(!confirm(v?'Zablokować dostęp? Użytkownik nie zaloguje się do aplikacji.':'Odblokować dostęp temu użytkownikowi?'))return;
  const r=await adminAction('set_blocked',{userId:id,blocked:v});
  if(r.error){toast('Błąd: '+r.error);return;}
  patchUser(id,{blocked:v});toast(v?'Zablokowano dostęp':'Odblokowano dostęp');renderUsers();
}
function renderAnnounce(){
  const list=db.announcements||[];
  let html=`<div class="panel"><div class="panel-h"><h3>Nowe ogłoszenie</h3></div>
  <div style="padding:14px 18px">
    <label class="muted-cell" style="display:block;margin-bottom:4px">Tytuł</label>
    <input id="an_title" placeholder="np. Nowe przepisy jesienne" style="margin-bottom:10px">
    <label class="muted-cell" style="display:block;margin-bottom:4px">Treść</label>
    <textarea id="an_body" rows="4" placeholder="Treść widoczna w zakładce Społeczność…"></textarea>
    <div style="margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button class="btn gold" onclick="createAnnouncement()">Opublikuj</button><span class="muted-cell">Nadawca: <b>The Grey Henry Society</b></span></div>
  </div></div>`;
  html+=`<div class="panel"><div class="panel-h"><h3>Opublikowane (${list.length})</h3></div>`;
  if(!list.length)html+='<div class="empty">Brak ogłoszeń.</div>';
  else html+='<table><thead><tr><th>Tytuł</th><th>Treść</th><th>Data</th><th></th></tr></thead><tbody>'+list.map(a=>`<tr><td><b>${esc(a.title)}</b></td><td class="muted-cell">${esc((a.body||'').slice(0,120))}${(a.body||'').length>120?'…':''}</td><td class="muted-cell">${fmtD(a.created_at)}</td><td><button class="btn sm danger" onclick="delAnnouncement('${a.id}')">Usuń</button></td></tr>`).join('')+'</tbody></table>';
  html+='</div>';
  $('view').innerHTML=html;
}
function renderPush(){
  let html=`<div class="panel"><div class="panel-h"><h3>Wyślij powiadomienie</h3></div>
  <div style="padding:16px 18px;max-width:560px">
    <p id="pushAudience" class="muted-cell" style="margin:0 0 4px">Subskrybentów: …</p>
    <p class="muted-cell" style="margin:0 0 6px;font-size:12.5px;line-height:1.6">Push dociera do osób, które włączyły powiadomienia na urządzeniu. Aby dotrzeć do <b>wszystkich</b> użytkowników, zaznacz opcję „Pokaż też jako ogłoszenie" — pojawi się w aplikacji u każdego.</p>
    <label style="display:block;margin:12px 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);font-weight:600">Tytuł</label>
    <input id="pushTitle" maxlength="120" placeholder="np. Nowy przepis w Henry's Table!" oninput="updatePushPreview()">
    <label style="display:block;margin:12px 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);font-weight:600">Treść</label>
    <textarea id="pushBody" rows="3" maxlength="300" placeholder="Treść powiadomienia…" oninput="updatePushPreview()"></textarea>
    <label style="display:block;margin:12px 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);font-weight:600">Link po kliknięciu (opcjonalnie)</label>
    <input id="pushUrl" placeholder="/">
    <label class="pushcheck"><input type="checkbox" id="pushAsAnn"> <span>Pokaż też jako ogłoszenie w aplikacji <b>— dotrze do wszystkich użytkowników</b></span></label>
    <div class="pushprev-wrap"><div class="pushprev-lbl">Podgląd powiadomienia</div>
      <div class="pushprev"><div class="pp-ic"><img src="logo/mono_gold.png" alt="" onerror="this.style.display='none'"></div><div class="pp-tx"><b id="ppTitle">Tytuł powiadomienia</b><span id="ppBody">Treść pojawi się tutaj…</span></div></div>
    </div>
    <div style="margin-top:16px"><button class="btn gold" type="button" onclick="sendBroadcastPush()">Wyślij do wszystkich</button></div>
    <p id="pushStatus" style="margin-top:12px;opacity:.85"></p>
  </div></div>`;
  $('view').innerHTML=html;
  loadPushAudience();
  updatePushPreview();
}
function updatePushPreview(){
  const t=(document.getElementById('pushTitle')||{}).value||'';
  const b=(document.getElementById('pushBody')||{}).value||'';
  const pt=document.getElementById('ppTitle'),pb=document.getElementById('ppBody');
  if(pt)pt.textContent=t||'Tytuł powiadomienia';
  if(pb)pb.textContent=b||'Treść pojawi się tutaj…';
}
async function loadPushAudience(){
  try{
    const { data, error } = await sb.rpc('push_audience_count');
    if(error) throw error;
    const el=document.getElementById('pushAudience');
    if(el) el.textContent='Subskrybentów: '+(data.devices||0)+' urządzeń ('+(data.users||0)+' użytkowników)';
  }catch(e){}
}
async function sendBroadcastPush(){
  const title=(document.getElementById('pushTitle').value||'').trim();
  const body=(document.getElementById('pushBody').value||'').trim();
  const url=(document.getElementById('pushUrl').value||'/').trim();
  const alsoAnn=document.getElementById('pushAsAnn')&&document.getElementById('pushAsAnn').checked;
  const status=document.getElementById('pushStatus');
  if(!title && !body){ if(status) status.textContent='Wpisz tytuł lub treść.'; return; }
  if(alsoAnn){
    if(!title){ if(status) status.textContent='Aby dotrzeć do wszystkich (ogłoszenie), podaj tytuł.'; return; }
    if(!confirm('Wysłać do WSZYSTKICH? Powiadomienie pojawi się w aplikacji u każdego użytkownika oraz jako push u osób z włączonymi powiadomieniami.')) return;
    if(status) status.textContent='Wysyłanie do wszystkich…';
    try{
      const {error}=await sb.from('announcements').insert({title,body:body||title,created_by:me.id});
      if(error) throw error;
      if(status) status.textContent='Wysłano do wszystkich ✓ — widoczne w aplikacji u każdego, push u subskrybentów.';
      document.getElementById('pushTitle').value='';document.getElementById('pushBody').value='';document.getElementById('pushAsAnn').checked=false;updatePushPreview();
    }catch(e){ if(status) status.textContent='Błąd: '+(e.message||e); }
    return;
  }
  if(!confirm('Wysłać powiadomienie push do wszystkich subskrybentów (osób z włączonymi powiadomieniami)?')) return;
  if(status) status.textContent='Wysyłanie…';
  try{
    const { data, error } = await sb.functions.invoke('send-push', { body:{ broadcast:true, title, body, url } });
    if(error) throw error;
    if(status) status.textContent='Wysłano do '+(data.sent||0)+' z '+(data.subscriptions||0)+' urządzeń'+(data.removed?(' · usunięto martwych: '+data.removed):'')+(data.failed?(' · błędy: '+data.failed):'');
  }catch(e){ if(status) status.textContent='Błąd wysyłki: '+(e.message||e); }
}
async function createAnnouncement(){
  const title=$('an_title').value.trim(),body=$('an_body').value.trim();
  if(!title||!body){toast('Podaj tytuł i treść');return;}
  const {error}=await sb.from('announcements').insert({title,body,created_by:me.id});
  if(error){toast('Błąd: '+error.message);return;}
  toast('Opublikowano ogłoszenie');await refreshAll();setView('announce');
}
async function delAnnouncement(id){
  if(!confirm('Usunąć ogłoszenie?'))return;
  const {error}=await sb.from('announcements').delete().eq('id',id);
  if(error){toast('Błąd: '+error.message);return;}
  toast('Usunięto ogłoszenie');await refreshAll();setView('announce');
}
// auto-login jeśli sesja istnieje
(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session){await afterLogin(data.session.user);}})();</script>
